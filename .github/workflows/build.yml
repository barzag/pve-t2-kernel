name: Bootstrap upstream discovery

on:
  workflow_dispatch:

  push:
    branches:
      - bootstrap-ci
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  discover:
    name: Discover upstream revisions
    runs-on: ubuntu-latest

    steps:
      - name: Discover latest published Proxmox kernel
        id: pve_repo
        shell: bash
        run: |
          set -euo pipefail

          REPO_URL="https://download.proxmox.com/debian/pve/dists/trixie/pve-no-subscription/binary-amd64/Packages.gz"

          echo "Downloading package index from:"
          echo "${REPO_URL}"

          curl \
            --fail \
            --location \
            --retry 3 \
            --silent \
            --show-error \
            "${REPO_URL}" \
            -o /tmp/proxmox-Packages.gz

          gzip -dc /tmp/proxmox-Packages.gz > /tmp/proxmox-Packages

          LATEST_PACKAGE="$(
            awk '
              /^Package: proxmox-kernel-[0-9].*-pve$/ {
                sub(/^Package: /, "")
                print
              }
            ' /tmp/proxmox-Packages |
            sort -V |
            tail -n 1
          )"

          if [[ -z "${LATEST_PACKAGE}" ]]; then
            echo "ERROR: no Proxmox kernel package found"
            exit 1
          fi

          LATEST_KERNEL="$(
            printf '%s\n' "${LATEST_PACKAGE}" |
            sed -E 's/^proxmox-kernel-(.*)-pve$/\1/'
          )"

          LATEST_VERSION="$(
            awk -v package="${LATEST_PACKAGE}" '
              BEGIN {
                RS=""
                FS="\n"
              }

              {
                found=0

                for (i=1; i<=NF; i++) {
                  if ($i == "Package: " package) {
                    found=1
                  }
                }

                if (found) {
                  for (i=1; i<=NF; i++) {
                    if ($i ~ /^Version: /) {
                      sub(/^Version: /, "", $i)
                      print $i
                      exit
                    }
                  }
                }
              }
            ' /tmp/proxmox-Packages
          )"

          if [[ -z "${LATEST_VERSION}" ]]; then
            echo "ERROR: package version could not be determined"
            exit 1
          fi

          echo "Latest published package: ${LATEST_PACKAGE}"
          echo "Latest published kernel:  ${LATEST_KERNEL}"
          echo "Debian package version:    ${LATEST_VERSION}"

          echo "package=${LATEST_PACKAGE}" >> "$GITHUB_OUTPUT"
          echo "kernel=${LATEST_KERNEL}" >> "$GITHUB_OUTPUT"
          echo "version=${LATEST_VERSION}" >> "$GITHUB_OUTPUT"    
      - name: Clone Proxmox kernel source
        id: pve
        shell: bash
        run: |
          set -euo pipefail

          git clone --filter=blob:none --no-checkout \
            https://github.com/proxmox/pve-kernel.git \
            proxmox-pve-kernel

          cd proxmox-pve-kernel

          PVE_SHA="$(git rev-parse HEAD)"
          PVE_BRANCH="$(git symbolic-ref --short HEAD)"
          PVE_SUBJECT="$(git log -1 --pretty=%s)"
          PVE_CHANGELOG="$(git show HEAD:debian/changelog | sed -n '1p')"

          echo "sha=${PVE_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=${PVE_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "subject=${PVE_SUBJECT}" >> "$GITHUB_OUTPUT"
          echo "changelog=${PVE_CHANGELOG}" >> "$GITHUB_OUTPUT"

      - name: Clone T2 patch source
        id: t2
        shell: bash
        run: |
          set -euo pipefail

          git clone --filter=blob:none --no-checkout \
            https://github.com/t2linux/linux-t2-patches.git \
            linux-t2-patches

          cd linux-t2-patches

          T2_SHA="$(git rev-parse HEAD)"
          T2_BRANCH="$(git symbolic-ref --short HEAD)"
          T2_SUBJECT="$(git log -1 --pretty=%s)"
          T2_KVER="$(git show HEAD:version | tr -d '\r\n')"

          echo "sha=${T2_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=${T2_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "subject=${T2_SUBJECT}" >> "$GITHUB_OUTPUT"
          echo "kver=${T2_KVER}" >> "$GITHUB_OUTPUT"

      - name: Write discovery summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          # Upstream discovery
          
          ## Published Proxmox kernel
          - Repository: `pve-no-subscription`
          - Package: `${{ steps.pve_repo.outputs.package }}`
          - Kernel: `${{ steps.pve_repo.outputs.kernel }}`
          - Package version: `${{ steps.pve_repo.outputs.version }}`
          ## Proxmox pve-kernel
          - Branch: `${{ steps.pve.outputs.branch }}`
          - SHA: `${{ steps.pve.outputs.sha }}`
          - Latest commit: `${{ steps.pve.outputs.subject }}`
          - Debian changelog: `${{ steps.pve.outputs.changelog }}`

          ## t2linux/linux-t2-patches
          - Branch: `${{ steps.t2.outputs.branch }}`
          - SHA: `${{ steps.t2.outputs.sha }}`
          - Kernel target: `${{ steps.t2.outputs.kver }}`
          - Latest commit: `${{ steps.t2.outputs.subject }}`

          This workflow only discovers upstream revisions.
          It does not build or publish a kernel.
          EOF
