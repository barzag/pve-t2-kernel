name: Bootstrap upstream discovery

on:
  workflow_dispatch:

  push:
    branches:
      - bootstrap-ci
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  discover:
    name: Discover upstream revisions
    runs-on: ubuntu-latest

    steps:
      - name: Discover latest published Proxmox kernel
        id: pve_repo
        shell: bash
        run: |
          set -euo pipefail

          RESULT="$(
            docker run --rm debian:trixie bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive

              apt-get update -qq
              apt-get install -y -qq ca-certificates curl >/dev/null

              curl \
                --fail \
                --location \
                --silent \
                --show-error \
                https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg \
                -o /usr/share/keyrings/proxmox-archive-keyring.gpg

              cat > /etc/apt/sources.list.d/proxmox.sources <<EOF
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: trixie
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
          EOF

              apt-get update -qq

              PACKAGE="$(
                apt-cache pkgnames |
                grep -E "^proxmox-kernel-[0-9].*-pve$" |
                sort -V |
                tail -n 1
              )"

              if [ -z "${PACKAGE}" ]; then
                echo "ERROR: no Proxmox kernel package found" >&2
                exit 1
              fi

              VERSION="$(
                apt-cache policy "${PACKAGE}" |
                awk "/Candidate:/ {print \$2; exit}"
              )"

              KERNEL="$(
                printf "%s\n" "${PACKAGE}" |
                sed -E "s/^proxmox-kernel-(.*)-pve$/\1/"
              )"

              printf "%s|%s|%s\n" \
                "${PACKAGE}" \
                "${KERNEL}" \
                "${VERSION}"
            '
          )"

          IFS='|' read -r LATEST_PACKAGE LATEST_KERNEL LATEST_VERSION <<< "$RESULT"

          echo "Latest published package: ${LATEST_PACKAGE}"
          echo "Latest published kernel:  ${LATEST_KERNEL}"
          echo "Debian package version:    ${LATEST_VERSION}"

          echo "package=${LATEST_PACKAGE}" >> "$GITHUB_OUTPUT"
          echo "kernel=${LATEST_KERNEL}" >> "$GITHUB_OUTPUT"
          echo "version=${LATEST_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Resolve published Proxmox source commit
        id: pve
        shell: bash
        run: |
          set -euo pipefail

          PUBLISHED_KERNEL="${{ steps.pve_repo.outputs.kernel }}"
          PUBLISHED_VERSION="${{ steps.pve_repo.outputs.version }}"

          echo "Published kernel:  ${PUBLISHED_KERNEL}"
          echo "Published version: ${PUBLISHED_VERSION}"

          git clone --filter=blob:none --no-checkout \
            https://github.com/proxmox/pve-kernel.git \
            proxmox-pve-kernel

          cd proxmox-pve-kernel

          EXPECTED_SUBJECT="update ABI file for ${PUBLISHED_KERNEL}-pve (amd64)"

          PVE_SHA="$(
            git log origin/master \
              --format='%H%x09%s' |
            awk -F '\t' -v expected="${EXPECTED_SUBJECT}" '
              $2 == expected && !found {
                print $1
                found=1
              }
            '
          )"

          if [[ -z "${PVE_SHA}" ]]; then
            echo "ERROR: unable to resolve published Proxmox source commit"
            exit 1
          fi

          PVE_SUBJECT="$(git show -s --format=%s "${PVE_SHA}")"

          PVE_CHANGELOG="$(
            git show "${PVE_SHA}:debian/changelog" |
            sed -n '1p'
          )"

          if ! grep -Fq "(${PUBLISHED_VERSION}) " <<< "${PVE_CHANGELOG}"; then
            echo "ERROR: resolved Git commit does not match published package version"
            exit 1
          fi

          echo "Resolved Proxmox source:"
          echo "SHA:       ${PVE_SHA}"
          echo "Commit:    ${PVE_SUBJECT}"
          echo "Changelog: ${PVE_CHANGELOG}"

          echo "sha=${PVE_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=master" >> "$GITHUB_OUTPUT"
          echo "subject=${PVE_SUBJECT}" >> "$GITHUB_OUTPUT"
          echo "changelog=${PVE_CHANGELOG}" >> "$GITHUB_OUTPUT"

      - name: Resolve T2 patch candidate
        id: t2
        shell: bash
        run: |
          set -euo pipefail

          PVE_KERNEL="${{ steps.pve_repo.outputs.kernel }}"

          PVE_SERIES="$(
            printf '%s\n' "${PVE_KERNEL}" |
            sed -E 's/^([0-9]+\.[0-9]+).*/\1/'
          )"

          echo "Proxmox kernel: ${PVE_KERNEL}"
          echo "Required T2 series: ${PVE_SERIES}"

          git clone --filter=blob:none --no-checkout \
            https://github.com/t2linux/linux-t2-patches.git \
            linux-t2-patches

          cd linux-t2-patches

          T2_SHA=""

          while read -r COMMIT; do
            KVER="$(
              git show "${COMMIT}:version" 2>/dev/null |
              sed -n 's/^KVER=//p' |
              tr -d '\r\n' ||
              true
            )"

            [[ -n "${KVER}" ]] || continue

            T2_SERIES="$(
              printf '%s\n' "${KVER}" |
              sed -E 's/^([0-9]+\.[0-9]+).*/\1/'
            )"

            if [[ "${T2_SERIES}" == "${PVE_SERIES}" ]]; then
              T2_SHA="${COMMIT}"
              T2_KVER="${KVER}"
              break
            fi
          done < <(git rev-list origin/main)

          if [[ -z "${T2_SHA}" ]]; then
            echo "ERROR: no T2 candidate found for ${PVE_SERIES}"
            exit 1
          fi

          T2_SUBJECT="$(git show -s --format=%s "${T2_SHA}")"

          echo "Resolved T2 candidate:"
          echo "SHA:    ${T2_SHA}"
          echo "KVER:   ${T2_KVER}"
          echo "Commit: ${T2_SUBJECT}"

          echo "sha=${T2_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=main" >> "$GITHUB_OUTPUT"
          echo "subject=${T2_SUBJECT}" >> "$GITHUB_OUTPUT"
          echo "kver=KVER=${T2_KVER}" >> "$GITHUB_OUTPUT"

      - name: Test T2 patch application
        id: compat
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C

          PVE_SHA="${{ steps.pve.outputs.sha }}"
          T2_SHA="${{ steps.t2.outputs.sha }}"

          SKIPPED_PATCH="2008-i915-4-lane-quirk-for-mbp15-1.patch"

          echo "Testing compatibility:"
          echo "Proxmox SHA: ${PVE_SHA}"
          echo "T2 SHA:      ${T2_SHA}"

          cd proxmox-pve-kernel

          git checkout --detach "${PVE_SHA}"

          git config \
            submodule.submodules/ubuntu-kernel.url \
            https://git.proxmox.com/git/mirror_ubuntu-kernels.git

          git submodule update \
            --init \
            --depth 1 \
            submodules/ubuntu-kernel

          cd ..

          cd linux-t2-patches
          git checkout --detach "${T2_SHA}"
          cd ..

          rm -rf kernel-compat

          cp -a \
            proxmox-pve-kernel/submodules/ubuntu-kernel \
            kernel-compat

          rm -rf \
            kernel-compat/debian \
            kernel-compat/debian.master

          cd kernel-compat

          echo "Applying official Proxmox patches..."

          for patchfile in ../proxmox-pve-kernel/patches/kernel/*.patch; do
            PATCH_NAME="$(basename "${patchfile}")"

            echo "PVE -> ${PATCH_NAME}"

            if ! patch \
              --batch \
              -p1 \
              < "${patchfile}" \
              > /tmp/pve-patch.log 2>&1
            then
              cat /tmp/pve-patch.log
              echo "ERROR: official Proxmox patch failed: ${PATCH_NAME}"
              exit 1
            fi
          done

          echo "Applying T2 candidate patches..."

          T2_COUNT=0
          T2_SKIPPED=0

          for patchfile in ../linux-t2-patches/*.patch; do
            [[ -e "${patchfile}" ]] || continue

            PATCH_NAME="$(basename "${patchfile}")"

            if [[ "${PATCH_NAME}" == "${SKIPPED_PATCH}" ]]; then
              echo "T2 SKIP -> ${PATCH_NAME}"
              echo "Reason: model-specific MBP15,1 i915 patch requires separate validation"

              T2_SKIPPED=$((T2_SKIPPED + 1))
              continue
            fi

            echo "T2 -> ${PATCH_NAME}"

            if ! patch \
              --batch \
              -p1 \
              < "${patchfile}" \
              > /tmp/t2-apply.log 2>&1
            then
              cat /tmp/t2-apply.log

              echo "compatible=false" >> "$GITHUB_OUTPUT"
              echo "failed_patch=${PATCH_NAME}" >> "$GITHUB_OUTPUT"
              echo "patch_count=${T2_COUNT}" >> "$GITHUB_OUTPUT"
              echo "skipped_count=${T2_SKIPPED}" >> "$GITHUB_OUTPUT"
              echo "skipped_patch=${SKIPPED_PATCH}" >> "$GITHUB_OUTPUT"

              echo "ERROR: T2 patch failed during real application: ${PATCH_NAME}"
              exit 1
            fi

            T2_COUNT=$((T2_COUNT + 1))
          done

          if [[ "${T2_COUNT}" -eq 0 ]]; then
            echo "ERROR: no T2 patches applied"
            exit 1
          fi

          echo "compatible=true" >> "$GITHUB_OUTPUT"
          echo "patch_count=${T2_COUNT}" >> "$GITHUB_OUTPUT"
          echo "skipped_count=${T2_SKIPPED}" >> "$GITHUB_OUTPUT"
          echo "skipped_patch=${SKIPPED_PATCH}" >> "$GITHUB_OUTPUT"

          echo "T2 compatibility baseline passed."
          echo "Applied patches: ${T2_COUNT}"
          echo "Skipped patches: ${T2_SKIPPED}"

      - name: Write discovery summary
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          # Upstream discovery

          ## Published Proxmox kernel
          - Repository: `pve-no-subscription`
          - Package: `${{ steps.pve_repo.outputs.package }}`
          - Kernel: `${{ steps.pve_repo.outputs.kernel }}`
          - Package version: `${{ steps.pve_repo.outputs.version }}`

          ## Proxmox source
          - SHA: `${{ steps.pve.outputs.sha }}`
          - Commit: `${{ steps.pve.outputs.subject }}`
          - Debian changelog: `${{ steps.pve.outputs.changelog }}`

          ## T2 candidate
          - SHA: `${{ steps.t2.outputs.sha }}`
          - Kernel target: `${{ steps.t2.outputs.kver }}`
          - Commit: `${{ steps.t2.outputs.subject }}`

          ## Compatibility
          - Baseline compatible: `${{ steps.compat.outputs.compatible }}`
          - T2 patches applied: `${{ steps.compat.outputs.patch_count }}`
          - T2 patches skipped: `${{ steps.compat.outputs.skipped_count }}`
          - Skipped patch: `${{ steps.compat.outputs.skipped_patch }}`
          - Failed patch: `${{ steps.compat.outputs.failed_patch }}`

          No kernel is compiled or published yet.
          EOF
